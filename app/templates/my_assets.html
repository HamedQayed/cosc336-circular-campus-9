{% extends 'base.html' %}{% block content %}<div class="title-row"><h1>My assets</h1><a class="button" href="{{url_for('assets.new')}}">Register an asset</a></div><div class="table-wrap"><table><thead><tr><th>Unit</th><th>Name</th><th>Publication</th><th>Serviceability</th><th>Lifecycle</th><th></th></tr></thead><tbody>{% for u in units %}<tr><td>#{{u.id}}</td><td>{{u.name}}</td><td>{{u.publication}}</td><td>{{u.serviceability}}</td><td>{{u.lifecycle}}</td><td><a href="{{url_for('assets.detail',unit_id=u.id)}}">Manage</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
